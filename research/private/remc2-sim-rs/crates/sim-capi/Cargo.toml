[package]
name = "sim-capi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sim-core = { path = "../sim-core" }
sha2 = "=0.10.9"

[lints.clippy]
all = "warn"
pedantic = "warn"

[lints.rust]
unsafe_code = "allow"
