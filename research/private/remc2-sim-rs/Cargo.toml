[workspace]
members = [
    "crates/atlas-registry",
    "crates/sim-archer-tmap",
    "crates/sim-classic-hd",
    "crates/sim-classic-hd-display",
    "crates/sim-collision",
    "crates/sim-combat-tmap",
    "crates/sim-countdown-switch",
    "crates/sim-definition",
    "crates/sim-economy-tmap",
    "crates/sim-enhanced-presentation",
    "crates/sim-firefly-tmap",
    "crates/sim-frozen-actor-tmap",
    "crates/sim-goat-map-chain",
    "crates/sim-goat-tmap",
    "crates/sim-ground-motion",
    "crates/sim-indexed-postprocess",
    "crates/sim-music",
    "crates/sim-render-camera",
    "crates/sim-renderable-map-chain",
    "crates/sim-session",
    "crates/sim-ss2-tmap",
    "crates/sim-static-world-tmap",
    "crates/sim-input",
    "crates/sim-terrain-presentation",
    "crates/sim-terrain-raster",
    "crates/sim-voxel",
    "crates/sim-core",
    "crates/sim-cli",
    "crates/sim-capi",
    "crates/sim-wasm",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "LicenseRef-Private-Research-Only"
publish = false
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# sim-core is a very large crate. Full DWARF plus parallel LLVM codegen has
# repeatedly crashed both LLVM 22 and LLVM 23 while compiling its test binary.
# Keep source line tables for ordinary development, but omit test-binary DWARF
# and serialize codegen to avoid the unstable high-pressure compiler path.
[profile.dev]
debug = 1
codegen-units = 1

[profile.test]
debug = 0
codegen-units = 1
